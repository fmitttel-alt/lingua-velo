name: LinguaVelo
options:
  bundleIdPrefix: com.linguavelo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    PRODUCT_NAME: LinguaVelo
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""   # Fill in your Apple Developer Team ID

targets:
  LinguaVelo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - LinguaVelo
    info:
      path: LinguaVelo/Info.plist
    settings:
      base:
        INFOPLIST_FILE: LinguaVelo/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.linguavelo.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_SKIP_APP_STORE_DEPLOYMENT: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": arm64
    scheme:
      testTargets: []
